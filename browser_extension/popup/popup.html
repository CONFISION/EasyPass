<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyPass</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
    }
    .header {
      padding: 16px;
      background: #181825;
      border-bottom: 1px solid #313244;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #89b4fa;
    }
    .status {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .status.connected { background: #a6e3a1; }
    .status.disconnected { background: #f38ba8; }
    .status.locked { background: #f9e2af; }
    
    .search-box {
      padding: 12px 16px;
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #313244;
      border-radius: 8px;
      background: #313244;
      color: #cdd6f4;
      font-size: 14px;
      outline: none;
    }
    .search-box input:focus {
      border-color: #89b4fa;
    }
    
    .entry-list {
      max-height: 300px;
      overflow-y: auto;
    }
    .entry-item {
      padding: 12px 16px;
      border-bottom: 1px solid #313244;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.2s;
    }
    .entry-item:hover {
      background: #313244;
    }
    .entry-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #45475a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .entry-info {
      flex: 1;
    }
    .entry-name {
      font-size: 14px;
      font-weight: 600;
    }
    .entry-username {
      font-size: 12px;
      color: #a6adc8;
    }
    .entry-url {
      font-size: 11px;
      color: #6c7086;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }
    
    .actions {
      padding: 16px;
      border-top: 1px solid #313244;
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.8; }
    .btn-primary { background: #89b4fa; color: #1e1e2e; }
    .btn-secondary { background: #45475a; color: #cdd6f4; }
    
    .empty-state {
      padding: 32px 16px;
      text-align: center;
      color: #6c7086;
    }
    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    
    .loading {
      padding: 32px;
      text-align: center;
      color: #6c7086;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #313244;
      border-top-color: #89b4fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔐 EasyPass</h1>
    <span id="statusDot" class="status disconnected" data-i18n-title="disconnected"></span>
  </div>
  
  <div class="search-box">
    <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" />
  </div>
  
  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <div data-i18n="loading"></div>
    </div>
  </div>
  
  <div class="actions">
    <button class="btn btn-secondary" id="btnGenerator">🔑 <span data-i18n="generator"></span></button>
    <button class="btn btn-primary" id="btnOpenApp">📱 <span data-i18n="openApp"></span></button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
