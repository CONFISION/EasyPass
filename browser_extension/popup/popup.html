<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyPass</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- ─── Header: brand · status pill · lock ─────────────── -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🔐</span>
        <h1 class="brand-name" data-i18n="extName">EasyPass</h1>
      </div>
      <div class="header-actions">
        <span id="statusPill" class="status-pill" role="status" aria-live="polite">
          <span id="statusDot" class="status loading" aria-hidden="true"></span>
          <span id="statusText" class="status-text" data-i18n="loading"></span>
        </span>
        <button type="button" id="btnLock" class="btn-lock" data-i18n-title="lock"
                data-i18n-aria="lock" hidden>
          <span id="btnLockIcon" class="btn-lock-icon" aria-hidden="true">🔒</span>
          <span id="btnLockLabel" data-i18n="lock"></span>
        </button>
      </div>
    </header>

    <!-- ─── Segmented tabs (reachable while locked too) ────── -->
    <nav id="tabBar" class="tab-bar" role="tablist" hidden>
      <button type="button" id="tabVault" class="tab" data-tab="vault" role="tab"
              aria-selected="true" aria-controls="panelVault" data-i18n="tabVault"></button>
      <button type="button" id="tabGenerator" class="tab" data-tab="generator" role="tab"
              aria-selected="false" aria-controls="panelGenerator" data-i18n="tabGenerator"></button>
      <button type="button" id="tabHealth" class="tab" data-tab="health" role="tab"
              aria-selected="false" aria-controls="panelHealth" data-i18n="tabHealth"></button>
    </nav>

    <main id="content" class="content">
      <!-- ─── Booting ─────────────────────────────────────── -->
      <section id="loadingView" class="view">
        <div class="center-state">
          <div class="spinner" aria-hidden="true"></div>
          <div data-i18n="loading"></div>
        </div>
      </section>

      <!-- ─── Native host unreachable / outdated ──────────── -->
      <section id="errorView" class="view" hidden>
        <div class="empty-state">
          <div class="icon" aria-hidden="true">⚠️</div>
          <div id="errorTitle" class="empty-title" data-i18n="cannotConnect"></div>
          <div id="errorDetail" class="empty-detail" hidden></div>
          <button type="button" id="btnRetry" class="btn btn-secondary btn-small empty-action"
                  data-i18n="healthRefresh"></button>
        </div>
      </section>

      <!-- ─── Locked: unlock card (vault tab) ─────────────── -->
      <section id="unlockView" class="view" hidden>
        <div class="unlock">
          <div class="unlock-icon" aria-hidden="true">🔒</div>
          <div class="unlock-title" data-i18n="vaultLocked"></div>
          <div class="unlock-hint" data-i18n="unlockHint"></div>
          <label class="sr-only" for="masterPassword" data-i18n="masterPassword"></label>
          <input type="password" id="masterPassword" data-i18n-placeholder="masterPassword"
                 autocomplete="off" spellcheck="false" />
          <div id="unlockError" class="form-error" role="alert" hidden></div>
          <button type="button" id="btnUnlock" class="btn btn-primary btn-block"
                  data-i18n="unlock"></button>
        </div>
      </section>

      <!-- ─── Unlocked: panels ────────────────────────────── -->
      <section id="mainView" class="view" hidden>
        <!-- Vault -->
        <div id="panelVault" class="panel" role="tabpanel" aria-labelledby="tabVault">
          <div class="search-box">
            <span aria-hidden="true">🔎</span>
            <label class="sr-only" for="searchInput" data-i18n="searchPlaceholder"></label>
            <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder"
                   autocomplete="off" spellcheck="false" />
          </div>
          <!-- Client-side type filter over the currently loaded list. Search stays
               server-side (searchCredentials); the filter never widens it. -->
          <div id="typeFilter" class="type-filter" role="group"
               data-i18n-aria="entryTypeFilterTooltip" data-i18n-title="entryTypeFilterTooltip">
            <button type="button" class="type-chip" data-action="filter-type" data-type="all"
                    aria-pressed="true" data-i18n="entryTypeAll"></button>
            <button type="button" class="type-chip" data-action="filter-type" data-type="login"
                    aria-pressed="false" data-i18n="entryTypeLogin"></button>
            <button type="button" class="type-chip" data-action="filter-type" data-type="secure_note"
                    aria-pressed="false" data-i18n="entryTypeSecureNote"></button>
            <button type="button" class="type-chip" data-action="filter-type" data-type="identity"
                    aria-pressed="false" data-i18n="entryTypeIdentity"></button>
            <button type="button" class="type-chip" data-action="filter-type" data-type="ssh_key"
                    aria-pressed="false" data-i18n="entryTypeSshKey"></button>
          </div>
          <div class="list-meta">
            <span id="vaultCount" class="meta-text"></span>
            <span id="pageBanner" class="meta-banner" hidden></span>
          </div>
          <div id="entryList" class="entry-list" aria-live="polite"></div>
        </div>

        <!-- Generator -->
        <div id="panelGenerator" class="panel" role="tabpanel" aria-labelledby="tabGenerator" hidden>
          <div class="gen-wrap">
            <output id="genResult" class="gen-result" aria-live="polite">—</output>
            <div id="genError" class="gen-error" role="alert" hidden>
              <span id="genErrorTitle"></span>
              <span id="genErrorDetail" class="gen-error-detail" hidden></span>
            </div>

            <div class="gen-controls">
              <div class="gen-row">
                <label class="gen-label" for="genLength" data-i18n="generatorLength"></label>
                <span id="genLengthValue" class="gen-length-value">16</span>
              </div>
              <input type="range" id="genLength" min="8" max="64" step="1" value="16"
                     aria-labelledby="genLength" />

              <div class="gen-options">
                <label class="checkbox">
                  <input type="checkbox" id="genUpper" checked />
                  <span data-i18n="generatorUpper"></span>
                </label>
                <label class="checkbox">
                  <input type="checkbox" id="genLower" checked />
                  <span data-i18n="generatorLower"></span>
                </label>
                <label class="checkbox">
                  <input type="checkbox" id="genNumbers" checked />
                  <span data-i18n="generatorNumbers"></span>
                </label>
                <label class="checkbox">
                  <input type="checkbox" id="genSymbols" checked />
                  <span data-i18n="generatorSymbols"></span>
                </label>
              </div>

              <div class="gen-actions">
                <button type="button" id="btnRegenerate" class="btn btn-secondary">
                  <span aria-hidden="true">🔄</span> <span data-i18n="generatorRegenerate"></span>
                </button>
                <button type="button" id="btnCopyGenerated" class="btn btn-primary">
                  <span aria-hidden="true">📋</span> <span data-i18n="generatorCopy"></span>
                </button>
              </div>

              <p class="hint" data-i18n="generatorHint"></p>
            </div>
          </div>
        </div>

        <!-- Health -->
        <div id="panelHealth" class="panel" role="tabpanel" aria-labelledby="tabHealth" hidden>
          <div class="health-head-bar">
            <button type="button" id="btnHealthRefresh" class="btn btn-secondary btn-small">
              <span aria-hidden="true">🔄</span> <span data-i18n="healthRefresh"></span>
            </button>
          </div>
          <div id="healthBody" class="health-body" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- ─── Toast ─────────────────────────────────────────── -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toastIcon" class="toast-icon" aria-hidden="true"></span>
    <div class="toast-body">
      <div id="toastText"></div>
      <div id="toastDetail" class="toast-detail" hidden></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
