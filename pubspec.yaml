name: easypass
description: "EasyPass - A secure password manager like Bitwarden."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.1.0+16

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # State Management
  flutter_riverpod: ^2.6.1
  # 纯 Dart 版 riverpod：数据层的 3 个文件（vault_repository / session_key /
  # master_password_rotation）用的是它。`flutter_riverpod` 只是 Flutter 薄壳，
  # Provider/StateProvider 是同一个类；换成纯 Dart 版后，核心服务
  # （AOT 控制台、无 dart:ui）才能把数据层编进闭包。
  riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # Routing
  go_router: ^14.8.1
  # Database
  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.5.30
  # 坑位提示（**不锁版本**，由 drift / sqlite3_flutter_libs 决定）：
  # `package:sqlite3` 的 build hook 在 Windows 上默认**从 GitHub 下载**预编译的
  # `sqlite3.x64.windows.dll`
  # （https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-<ver>/…）。
  # 网络/代理没通时 `flutter build windows` 会在 build_hooks 阶段失败，只报
  # `Building native assets failed`，真实原因要跑下面这条才看得到
  # （会打印 `SocketException / errno 121`）：
  #
  #   flutter assemble --no-version-check --output=build\agent_assemble `
  #     -dTargetPlatform=windows-x64 -dBuildMode=release debug_bundle_windows-x64_assets
  #
  # 也就是说：**先确认代理/网络能访问 GitHub**，而不是去改依赖版本。
  path: ^1.9.1
  # 纯 Dart 注解（visibleForTesting）。核心服务（bin/easypass_core.dart）不能
  # 依赖 flutter/foundation，因此这类注解统一走 package:meta。
  meta: ^1.16.0
  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.6
  # Secure Storage
  flutter_secure_storage: ^9.2.4
  # UUID Generation
  uuid: ^4.5.1
  # Share/Export
  share_plus: ^10.1.4
  file_picker: ^8.1.7

# sqlite3 hook —— **这不是 Windows 需要的配置**，它是给 git 的 `linux` 分支用的
# （那边 linux/CMakeLists.txt 会把 sqlite3_flutter_libs 里的 sqlite.org 源码编成
# `libsqlite3.so`，`source: system` 让加载器按这个名字去找）。
#
# 主分支（Windows only）保留它，只是为了将来与 `linux` 分支 merge 时不丢掉这一行。
# 对 Windows 没有影响：map 形式下 Windows 查不到自己的 entry，`source` 落到 null，
# 走"从 GitHub 下载预编译二进制"那条路 —— 与整段 hooks 不存在完全一致（实测过：
# 删掉整个 hooks 段后 `flutter test` 照常通过）。
#
# ⚠️ 唯一的雷：写成**裸 `source: system`**（不带 map）。那样 Windows 也会去
# `LookupSystem("sqlite3")`，而 Windows 没有系统 libsqlite3，于是 `flutter test`
# 一次 206 个用例失败在 "Failed to load dynamic library 'sqlite3.dll'"。
# 一句话：`source` 必须是 map 形式或整段不存在，**不要写成裸 system**。
hooks:
  user_defines:
    sqlite3:
      source:
        linux: system

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Code Generation
  #
  # 版本下限由 Dart SDK 决定：analyzer 必须能解析当前 SDK 的语言版本，
  # 否则 drift_dev 会在解析依赖源码时崩溃（analyzer 7.x 遇到 Dart 3.13 的
  # dot-shorthand 语法会抛 "Missing implementation of
  # visitDotShorthandPropertyAccess"），database.g.dart 直接生成不出来。
  # drift_dev >= 2.34.6 要求 analyzer >= 13，因此 build_runner 也要跟上。
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  # 说明：riverpod_generator / riverpod_lint / custom_lint 已移除。
  # 本仓库的 provider 全部手写、没有 @riverpod 注解，这三者不产出任何东西；
  # 且 custom_lint ^0.7 锁死 analyzer ^7，正是上面那次 codegen 崩溃的元凶。
  # 将来真要用 @riverpod：重新加入这三个依赖，并同时升级 riverpod 全家桶。

