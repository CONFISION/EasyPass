name: CI

# ─── 触发条件 ─────────────────────────────────────────────────────────────
# · push 到 master / linux（本仓库的双主线：master = Windows only，
#   linux = 同时保留 Linux 支持）
# · 任何 pull_request（GitHub 默认的 opened / synchronize / reopened）
# · 手动 workflow_dispatch（改工作流本身上线前先点一次）
# 说明见 .github/workflows/README.md。
on:
  push:
    branches: [master, linux]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 再推一次时取消上一次运行：CI 只关心最新一次提交。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 本工作流只需要读仓库。
permissions:
  contents: read

env:
  # Flutter 3.47.5（channel stable，自带 Dart 3.13.4）。三条依据：
  #   1) pubspec.yaml 要求 Dart ^3.12.2 —— 3.13.4 满足；
  #   2) .metadata 记录的 revision 6a19cca56475dbfba1478ee68d7bd0c2ef891da1 就是 3.47.5；
  #   3) owner 本机 `flutter --version` 同样是 3.47.5，CI 与本机的工具链因此一致。
  # subosito/flutter-action 会按这个精确版本去官方归档下载
  # （flutter_windows_3.47.5-stable.zip 已验证存在）。升级 Flutter 时只改这一处。
  FLUTTER_VERSION: 3.47.5
  # jsdom 30.1.3（根 package.json 里精确锁定）的 engines 要求
  # node ^22.22.2 || ^24.15.0 || >=26.0.0；24.22.0 是当前 LTS。
  NODE_VERSION: 24.22.0

jobs:
  windows:
    name: Windows — analyze / test / extension / runner syntax
    # Windows 是 master 的基准平台：Linux-only 的用例在 Windows 上不注册用例
    # （见 AGENTS.md），所以 Windows 门禁只在 master 侧有意义。
    # 推到 `linux` 分支时跳过（那边的门禁是下面的 linux job），避免每次同步都
    # 白跑 20 分钟 Windows 任务；PR 与手动触发仍然两边都跑。
    if: github.event_name != 'push' || github.ref_name != 'linux'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ─── 1. 依赖 ──────────────────────────────────────────────────────
      # pubspec.yaml 里 `flutter: generate: true` + l10n.yaml，pub get 会顺带
      # 重新生成 lib/l10n/app_localizations*.dart（这些文件是入库的，生成结果
      # 与本机 3.47.5 一致时工作区不会有 diff）。
      - name: flutter pub get
        run: flutter pub get

      # ─── 2. lint ─────────────────────────────────────────────────────
      # --no-pub：依赖已装好，pub 在 CI 上重复跑只会多一次网络往返。
      - name: flutter analyze
        run: flutter analyze --no-pub

      # ─── 3. 全量测试 ──────────────────────────────────────────────────
      # 注意：`flutter test` 之间会抢 build\native_assets\windows\sqlite3.dll，
      # 所以这个工作流里只跑一次、且不与其他 Flutter 任务并行。
      - name: flutter test
        run: flutter test --no-pub

      # ─── 4. 浏览器扩展：静态检查 + jsdom 冒烟测试 ─────────────────────
      # jsdom 来自仓库根目录的 package.json（精确锁 30.1.3），`npm ci` 按
      # 入库的 package-lock.json 安装到 <repo>/node_modules。三个 smoke 脚本里的
      # `require('jsdom')` 是从 browser_extension/tools/ 逐级向上解析的，因此
      # 直接命中仓库根的 node_modules —— 不需要往 %TEMP%\easypass-smoke 里装东西
      # （那条旧路径仍作为本地兜底保留在脚本里，脚本本身一行未改）。
      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Extension static check (check_extension.mjs)
        run: node browser_extension/tools/check_extension.mjs

      - name: Content-script smoke (jsdom)
        run: node browser_extension/tools/smoke_content.mjs

      - name: Popup smoke (jsdom)
        run: node browser_extension/tools/smoke_popup.mjs

      - name: Popup extra smoke (jsdom)
        run: node browser_extension/tools/smoke_popup_extra.mjs

      # ─── 5. windows/runner 语法检查（不调用 MSBuild）──────────────────
      # check_syntax.bat 用 cl /Zs /W4 /WX 解析 runner 源码，但它的 /I 里列了
      # windows\flutter\ephemeral：flutter_windows.h 与
      # cpp_client_wrapper\include\flutter\*.h 都在那里。这些文件平时是 CMake
      # 构建中的 flutter_assemble 目标拷进去的，而 CI 不跑 `flutter build windows`，
      # 所以这里显式做同一件事：
      #   · `flutter precache --windows` 先把引擎产物拉到 SDK 缓存；
      #   · 再跑 debug bundle 目标（= `flutter build windows --debug` 在调 MSBuild
      #     之前的那一步：只解包引擎产物 + 编译 Dart kernel，不编译任何 C++）。
      # 两个坑（都已实测）：defines 必须加引号，否则 PowerShell/批处理会把
      # `lib/main.dart` 传成 `lib/main`；不能直接跑 `unpack_windows` —— 这个名字在
      # flutter_tools 里同时注册了 x64 与 arm64 两个 target，后注册的 arm64 会覆盖
      # x64，于是去找 windows-arm64-release 的产物并失败。
      - name: Prepare windows/flutter/ephemeral for check_syntax
        shell: pwsh
        run: |
          flutter precache --windows
          flutter assemble --no-version-check --output=build `
            "-dTargetPlatform=windows-x64" "-dBuildMode=debug" "-dTargetFile=lib/main.dart" `
            debug_bundle_windows-x64_assets

      - name: Runner syntax check (check_syntax.bat)
        run: cmd /c windows\runner\check_syntax.bat

  linux:
    name: Linux — analyze / test / extension
    # linux 分支保留了 Linux 平台层（linux/**、lib/features/desktop_*/linux_*、
    # XDG 路径、native-messaging wrapper…），这些用例只在 Linux runner 上注册；
    # 与 master 的 Windows job 互补，而不是重复。
    #
    # 真正的出包（.deb）在 `.github/workflows/linux-build.yml`：CI 只管"代码对不对"，
    # 构建工作流管"包能不能下"。两者分开是为了让 PR 反馈快，而 artifact 只在
    # push 到 linux 时生成。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # GTK 3 + libayatana-appindicator3 是 linux/runner 的编译依赖；
      # libsecret-1-dev 供 flutter_secure_storage_linux。
      # 刻意不装 libsqlite3-dev：bundle 自带 libsqlite3.so，核心靠
      # LD_LIBRARY_PATH 找它（见 AGENTS.md「Linux .deb packaging」）。
      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libsecret-1-dev

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-pub

      # `XDG_CONFIG_HOME` / `XDG_DATA_HOME` 必须**不存在**：browser_host 的用例
      # 用临时 $HOME 断言 vendor 根与 manifest 落在那里，install() 会回落到环境
      # 变量；导出它们会让用例写进真实 ~/.config 并连带 8 条假失败（本机踩过）。
      # GitHub runner 默认不导出，这里显式清一遍，防止将来 runner 镜像带上。
      - name: flutter test
        run: env -u XDG_CONFIG_HOME -u XDG_DATA_HOME flutter test --no-pub

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Extension static check (check_extension.mjs)
        run: node browser_extension/tools/check_extension.mjs

      - name: Content-script smoke (jsdom)
        run: node browser_extension/tools/smoke_content.mjs

      - name: Popup smoke (jsdom)
        run: node browser_extension/tools/smoke_popup.mjs

      - name: Popup extra smoke (jsdom)
        run: node browser_extension/tools/smoke_popup_extra.mjs

      # Amazon 上的 runner 没有 X 显示；`flutter build linux` 本身不需要它，
      # 但把这个前置检查放这里，顺便验证 `linux/runner` 的 C++ 能编过 ——
      # 3.0.0 的 `easypass_tray.cc` 就因为 GTK_DIALOG_MODAL 的类型错误只在
      # Linux 上炸，而 master 的 Windows-only CI 从没编译过它。
      - name: Build Linux runner (compile check)
        run: flutter build linux --release
